# Copy this file to config.yaml and fill in deployment-specific values.
# config.yaml is ignored by Git so database credentials and JWT secrets stay local.

server:
  address: ":8000"
  # Set false in production to disable both Swagger UI and /api.json.
  swagger_enabled: true
  openapiPath: "/api.json"
  swaggerPath: "/swagger"

logger:
  level: "all"
  stdout: true

cache:
  # SELECT cache names: {prefix}#selectCache#{table}_{id}; loaded at startup.
  prefix: "indu-scope"

database:
  default:
    type: "mysql"
    link: "mysql:用户名:密码@tcp(主机:3306)/数据库?charset=utf8mb4&parseTime=true&loc=Local"
    maxOpen: 10
    maxIdle: 10

jwt:
  secret: "请替换为至少32个字符的随机字符串"

wechat:
  app_id: "微信小程序 AppID"
  app_secret: "微信小程序 AppSecret"
  api_base_url: "https://api.weixin.qq.com"

# Ordinary mini-program payment, using WeChat Pay PUBLIC KEY mode.
# The app_id uses wechat.app_id above. Never use a different app's openid.
# Each field also supports a WECHAT_PAY_<UPPERCASE_FIELD> environment variable.
wechat_pay:
  enabled: false
  mch_id: "微信支付商户号"
  merchant_serial_no: "商户证书序列号"
  api_v3_key: ""
  merchant_private_key_path: "/run/secrets/apiclient_key.pem"
  public_key_id: "PUB_KEY_ID_替换为商户平台的公钥ID"
  public_key_path: "/run/secrets/pub_key.pem"
  notify_url: "https://你的域名/api/v1/payment/wechat/notify"
  # Optional: defaults to the same domain/path prefix as notify_url.
  refund_notify_url: "https://你的域名/api/v1/payment/wechat/refund/notify"

oss:
  # Use environment variables OSS_ENDPOINT, OSS_BUCKET, OSS_ACCESS_KEY_ID,
  # and OSS_ACCESS_KEY_SECRET in production. These values are never sent to
  # the mini-program.
  endpoint: "https://oss-cn-beijing.aliyuncs.com"
  # Development: env-develop. Production: env-production.
  bucket: "env-develop"
  access_key_id: ""
  access_key_secret: ""
  key_prefix: "indu/verification"

ocr:
  # Optional; defaults to ocr-api.cn-hangzhou.aliyuncs.com.
  endpoint: "ocr-api.cn-hangzhou.aliyuncs.com"

redis:
  default:
    address: "redis主机:6379"
    user: "redis用户名"
    pass: "redis密码"
    db: 0
    dialTimeout: "5s"
    readTimeout: "3s"
    writeTimeout: "3s"
