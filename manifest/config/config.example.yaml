# Copy this file to config.yaml and fill in deployment-specific values.
# config.yaml is ignored by Git so database credentials and JWT secrets stay local.

server:
  address: ":8000"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"

logger:
  level: "all"
  stdout: true

database:
  default:
    type: "mysql"
    link: "mysql:用户名:密码@tcp(主机:3306)/数据库?charset=utf8mb4&parseTime=true&loc=Local"
    maxOpen: 10
    maxIdle: 10

jwt:
  secret: "请替换为至少32个字符的随机字符串"

wechat:
  app_id: "微信小程序 AppID"
  app_secret: "微信小程序 AppSecret"
  api_base_url: "https://api.weixin.qq.com"

oss:
  # Use environment variables OSS_ENDPOINT, OSS_BUCKET, OSS_ACCESS_KEY_ID,
  # and OSS_ACCESS_KEY_SECRET in production. These values are never sent to
  # the mini-program.
  endpoint: "https://oss-cn-beijing.aliyuncs.com"
  # Development: env-develop. Production: env-production.
  bucket: "env-develop"
  access_key_id: ""
  access_key_secret: ""
  key_prefix: "indu/verification"

redis:
  default:
    address: "redis主机:6379"
    user: "redis用户名"
    pass: "redis密码"
    db: 0
    dialTimeout: "5s"
    readTimeout: "3s"
    writeTimeout: "3s"
