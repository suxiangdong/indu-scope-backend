apiVersion: v1
kind: ConfigMap
metadata:
  name: template-single-configmap
data:
  config.yaml: |
    server:
      address:     ":8000"
      swagger_enabled: true
      openapiPath: "/api.json"
      swaggerPath: "/swagger"

    logger:
      level : "all"
      stdout: true

    oss:
      endpoint: "https://oss-cn-beijing.aliyuncs.com"
      bucket: "env-develop"
      key_prefix: "indu/verification"
